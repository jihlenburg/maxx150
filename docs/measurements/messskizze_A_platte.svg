<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1150" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="1150" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Messskizze Gruppe A — Karosseriebefestigungsplatte</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#666">schematisch, nicht maßstäblich · rote Codes = Felder im Messprotokoll</text>

  <!-- ======================= ANSICHT 1: UNTERSEITE ======================= -->
  <text x="70" y="88" font-size="15" font-weight="bold" fill="#222">Ansicht 1 — Blick auf die Plattenunterseite</text>

  <!-- Flansch aussen -->
  <rect x="90" y="120" width="540" height="400" rx="18" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <!-- Ringklebenut (2 gestrichelte Ringe nahe Aussenkante) -->
  <rect x="106" y="136" width="508" height="368" rx="14" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="122" y="152" width="476" height="336" rx="12" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="146" y="148" font-size="10" fill="#666">Ringklebenut (Kleberippen-Zone)</text>

  <!-- Kragen (asymmetrisch: vorn schmal, hinten breit) -->
  <rect x="140" y="150" width="340" height="340" rx="8" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
  <text x="310" y="325" text-anchor="middle" font-size="12" fill="#999">Einbaukragen (Öffnung)</text>

  <!-- Gussets: Dreiecke am Kragen, nach aussen zeigend -->
  <g fill="#d9d9d9" stroke="#555" stroke-width="1">
    <path d="M480,200 l26,10 l-26,10 z"/>
    <path d="M480,310 l26,10 l-26,10 z"/>
    <path d="M480,420 l26,10 l-26,10 z"/>
    <path d="M140,200 l-26,10 l26,10 z"/>
    <path d="M140,310 l-26,10 l26,10 z"/>
    <path d="M240,150 l10,-22 l10,22 z"/>
    <path d="M360,150 l10,-22 l10,22 z"/>
  </g>
  <text x="520" y="215" font-size="10" fill="#666">Dreiecks-Gussets</text>

  <!-- Bemassung A1a (aussen Laenge, oben) -->
  <g stroke="#0057b8" stroke-width="1.5" fill="#0057b8">
    <line x1="90" y1="104" x2="630" y2="104"/>
    <path d="M90,104 l8,-4 v8 z"/><path d="M630,104 l-8,-4 v8 z"/>
    <line x1="90" y1="112" x2="90" y2="98" stroke-width="1"/>
    <line x1="630" y1="112" x2="630" y2="98" stroke-width="1"/>
  </g>
  <text x="360" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#b30000">A1a = Flansch außen, Länge</text>

  <!-- Bemassung A1b (aussen Breite, links) -->
  <g stroke="#0057b8" stroke-width="1.5" fill="#0057b8">
    <line x1="66" y1="120" x2="66" y2="520"/>
    <path d="M66,120 l-4,8 h8 z"/><path d="M66,520 l-4,-8 h8 z"/>
  </g>
  <text x="58" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#b30000" transform="rotate(-90 58 325)">A1b = Flansch außen, Breite</text>

  <!-- A1c vorn (links schmal) -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="90" y1="345" x2="140" y2="345"/>
    <path d="M90,345 l8,-4 v8 z"/><path d="M140,345 l-8,-4 v8 z"/>
  </g>
  <text x="115" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#b30000">A1c</text>
  <text x="115" y="379" text-anchor="middle" font-size="10" fill="#555">VORN</text>

  <!-- A1d hinten (rechts breit) -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="480" y1="345" x2="630" y2="345"/>
    <path d="M480,345 l8,-4 v8 z"/><path d="M630,345 l-8,-4 v8 z"/>
  </g>
  <text x="555" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#b30000">A1d</text>
  <text x="555" y="379" text-anchor="middle" font-size="10" fill="#555">HINTEN (Haubenüberstand)</text>

  <!-- A1e oben / A1f unten -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="200" y1="120" x2="200" y2="150"/>
    <path d="M200,120 l-4,8 h8 z"/><path d="M200,150 l-4,-8 h8 z"/>
    <line x1="200" y1="490" x2="200" y2="520"/>
    <path d="M200,490 l-4,8 h8 z"/><path d="M200,520 l-4,-8 h8 z"/>
  </g>
  <text x="222" y="140" font-size="12" font-weight="bold" fill="#b30000">A1e</text>
  <text x="222" y="512" font-size="12" font-weight="bold" fill="#b30000">A1f</text>

  <!-- A2a / A2b an der Nut -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="630" y1="452" x2="614" y2="452"/>
    <path d="M630,452 l-8,-4 v8 z"/><path d="M614,452 l8,-4 v8 z"/>
  </g>
  <text x="648" y="448" font-size="12" font-weight="bold" fill="#b30000">A2a</text>
  <text x="648" y="462" font-size="9" fill="#555">Kante→Nut</text>
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="606" y1="475" x2="590" y2="475"/>
    <path d="M606,475 l-8,-4 v8 z"/><path d="M590,475 l8,-4 v8 z"/>
  </g>
  <text x="648" y="480" font-size="12" font-weight="bold" fill="#b30000">A2b</text>
  <text x="648" y="493" font-size="9" fill="#555">Nutbreite</text>

  <!-- A4b Gusset-Reichweite -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="480" y1="240" x2="506" y2="240"/>
    <path d="M480,240 l8,-4 v8 z"/><path d="M506,240 l-8,-4 v8 z"/>
  </g>
  <text x="540" y="244" font-size="12" font-weight="bold" fill="#b30000">A4b</text>
  <text x="540" y="257" font-size="9" fill="#555">Gusset-Reichweite</text>

  <!-- A5b Klips-Position -->
  <circle cx="310" cy="150" r="5" fill="none" stroke="#b30000" stroke-width="2"/>
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="140" y1="170" x2="305" y2="170"/>
    <path d="M140,170 l8,-4 v8 z"/><path d="M305,170 l-8,-4 v8 z"/>
  </g>
  <text x="222" y="188" font-size="12" font-weight="bold" fill="#b30000">A5b = Klips-Abstand von der Ecke (je Klips notieren)</text>

  <!-- ======================= ANSICHT 2: SCHNITT ======================= -->
  <text x="70" y="600" font-size="15" font-weight="bold" fill="#222">Ansicht 2 — Schnitt: ZWEI Kragen (oben Clips → Lüfter-Sockel, unten Einbaukragen → Ausschnitt)</text>

  <!-- Flanschplatte -->
  <rect x="100" y="640" width="520" height="20" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="112" y="634" font-size="10" fill="#666">Flansch (Oberseite zeigt zum Himmel)</text>

  <!-- Ringklebenut: -2-mm-Trog INS Material, 2 duenne Stege im Trog
       (Korrektur 2026-07-13 nach Foto: A2c ist INVERS, Stege tragen nicht) -->
  <rect x="112" y="646" width="60" height="14" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <g fill="#d9d9d9" stroke="#555" stroke-width="1">
    <rect x="124" y="646" width="6" height="10"/>
    <rect x="146" y="646" width="6" height="10"/>
  </g>
  <text x="112" y="686" font-size="10" fill="#666">Ringklebenut = Trog (−2 mm) mit 2 dünnen Stegen,</text>
  <text x="112" y="698" font-size="10" fill="#666">Stege enden ÜBER der Auflageebene → tragen nicht</text>
  <!-- Kontaktebene = flache Flansch-Unterseite -->
  <line x1="100" y1="660" x2="640" y2="660" stroke="#0057b8" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="644" y="663" font-size="9" fill="#0057b8">Auflage-/Kontaktebene</text>
  <text x="644" y="674" font-size="9" fill="#0057b8">= Flansch-Unterseite</text>

  <!-- OBERER Clip-Kragen (zum Lüfter-Sockel) -->
  <rect x="520" y="550" width="22" height="90" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <rect x="542" y="562" width="9" height="20" fill="#cccccc" stroke="#555" stroke-width="1"/>
  <text x="512" y="545" font-size="10" fill="#666" text-anchor="end">oberer Clip-Kragen (A3b = 20)</text>
  <text x="556" y="558" font-size="10" fill="#666">Metallclip (A5b = 59 je Ecke)</text>

  <!-- UNTERER Einbaukragen (taucht in den 400er-Ausschnitt) -->
  <rect x="508" y="660" width="22" height="90" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <circle cx="519" cy="705" r="5" fill="#fff" stroke="#b30000" stroke-width="2"/>
  <text x="548" y="708" font-size="10" fill="#b30000">← F2 (z-Lage) · F3 (Ø)</text>
  <path d="M530,660 L578,660 L530,722 Z" fill="#d9d9d9" stroke="#555" stroke-width="1.2"/>
  <text x="584" y="672" font-size="10" fill="#666">Gussets (innen)</text>
  <text x="500" y="792" font-size="9" fill="#666">unterer Einbaukragen → taucht in den 400er-</text>
  <text x="500" y="804" font-size="9" fill="#666">Ausschnitt; seitliche Befestigungslöcher →</text>
  <text x="500" y="816" font-size="9" fill="#666">Schrauben in unsere Adapter-Innenwand</text>

  <!-- A2c Trogtiefe (invers) -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="92" y1="646" x2="92" y2="660"/>
    <path d="M92,646 l-3,5 h6 z"/><path d="M92,660 l-3,-5 h6 z"/>
    <line x1="88" y1="646" x2="116" y2="646" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <text x="86" y="644" font-size="12" font-weight="bold" fill="#b30000" text-anchor="end">A2c = −2</text>
  <text x="86" y="657" font-size="9" fill="#555" text-anchor="end">Trogtiefe (invers)</text>

  <!-- A4a Tiefe unterer Einbaukragen unter Flansch-Unterseite -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="480" y1="660" x2="480" y2="750"/>
    <path d="M480,660 l-4,8 h8 z"/><path d="M480,750 l-4,-8 h8 z"/>
    <line x1="476" y1="750" x2="532" y2="750" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <text x="462" y="700" font-size="12" font-weight="bold" fill="#b30000" text-anchor="end">A4a = 20</text>
  <text x="462" y="714" font-size="9" fill="#555" text-anchor="end">Tiefe unterer Kragen</text>

  <!-- A3b Hoehe oberer Clip-Kragen -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="672" y1="550" x2="672" y2="640"/>
    <path d="M672,550 l-4,8 h8 z"/><path d="M672,640 l-4,-8 h8 z"/>
    <line x1="542" y1="550" x2="680" y2="550" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="542" y1="640" x2="680" y2="640" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <text x="666" y="585" font-size="12" font-weight="bold" fill="#b30000" text-anchor="end">A3b = 20</text>

  <!-- A3c Wandstaerke unterer Kragen -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="508" y1="762" x2="530" y2="762"/>
    <path d="M508,762 l6,-3 v6 z"/><path d="M530,762 l-6,-3 v6 z"/>
  </g>
  <text x="490" y="768" text-anchor="end" font-size="12" font-weight="bold" fill="#b30000">A3c</text>

  <!-- A5a Clip-Loch ueber Flansch-OBERSEITE -->
  <circle cx="546" cy="572" r="4" fill="#fff" stroke="#b30000" stroke-width="2"/>
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="562" y1="572" x2="562" y2="640"/>
    <path d="M562,572 l-4,8 h8 z"/><path d="M562,640 l-4,-8 h8 z"/>
  </g>
  <text x="568" y="612" font-size="12" font-weight="bold" fill="#b30000">A5a = 12</text>

  <!-- A3a Kragen-Aussenmass (Hinweis) -->
  <text x="100" y="920" font-size="12" fill="#333">A3a = Kragen-Außenmaß in beiden Richtungen (in Ansicht 1 über die Öffnung messen)</text>

  <!-- Messanleitung A4a -->
  <rect x="90" y="950" width="540" height="170" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <text x="108" y="978" font-size="13" font-weight="bold" fill="#222">Noch offen (Gruppe F, am UNTEREN Einbaukragen):</text>
  <text x="108" y="1002" font-size="12" fill="#333">F1 = Anzahl Befestigungslöcher je Seite + Abstände von der Ecke</text>
  <text x="108" y="1022" font-size="12" fill="#333">F2 = Lochmitte unter der Flansch-Unterseite (z-Lage) · F3 = Loch-Ø</text>
  <text x="108" y="1042" font-size="12" fill="#333">A3a = Außenmaß des UNTEREN Kragens, beide Richtungen (muss unter 400 liegen)</text>
  <text x="108" y="1062" font-size="12" fill="#333">A3c = Wandstärke des unteren Kragens</text>
  <text x="108" y="1088" font-size="12" fill="#333">A4a = 20 geklärt: Kragen + Gussets liegen radial INNERHALB des Ausschnitts →</text>
  <text x="108" y="1108" font-size="12" fill="#333">unsere Deck-Freistellung entfällt (REC_GUSSET_D = 0), Deck bleibt voll tragfähig.</text>
</svg>