<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="980" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Messskizze Gruppe B — Fahrzeug (ohne Demontage)</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#666">schematisch, nicht maßstäblich · rote Codes = Felder im Messprotokoll · Heck rechts</text>

  <!-- ======================= ANSICHT 1: SEITENSCHNITT DACH HINTEN ======================= -->
  <text x="60" y="92" font-size="15" font-weight="bold" fill="#222">Ansicht 1 — Seitenschnitt: Dach hinten mit Mini-Heki (noch verbaut) und hoher Heckkante</text>

  <!-- Dachplatte links vom Ausschnitt -->
  <rect x="60" y="300" width="120" height="40" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <!-- Dachplatte rechts vom Ausschnitt bis zur Kante -->
  <rect x="360" y="300" width="260" height="40" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="480" y="326" font-size="11" fill="#999" text-anchor="middle">Dach (GFK-Sandwich)</text>
  <text x="110" y="326" font-size="11" fill="#999" text-anchor="middle">Dach</text>

  <!-- hohe Heckkante -->
  <rect x="580" y="245" width="40" height="95" fill="#e2e2e2" stroke="#333" stroke-width="2.5"/>
  <text x="600" y="238" font-size="11" fill="#666" text-anchor="middle">hohe Heckkante</text>

  <!-- Ausschnitt (Loch) -->
  <text x="270" y="356" font-size="10" fill="#999" text-anchor="middle">400er-Ausschnitt (unter dem Heki-Rahmen verdeckt)</text>

  <!-- Mini-Heki-Rahmen: Flansch liegt auf dem Dach, ragt über den Ausschnitt hinaus -->
  <rect x="140" y="288" width="260" height="12" rx="3" fill="#d9d9d9" stroke="#555" stroke-width="1.5"/>
  <!-- Heki-Haube angedeutet -->
  <path d="M155,288 Q270,225 385,288 Z" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="270" y="270" font-size="11" fill="#666" text-anchor="middle">Mini-Heki (bleibt montiert)</text>

  <!-- Ausschnitt-Hinterkante (verdeckt) -->
  <line x1="360" y1="288" x2="360" y2="378" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="360" y="392" font-size="10" fill="#555" text-anchor="middle">Ausschnitt-Hinterkante (verdeckt)</text>

  <!-- Rahmenaussenkante hinten -->
  <line x1="400" y1="284" x2="400" y2="418" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="418" y="430" font-size="10" fill="#555" text-anchor="middle">Rahmenaußenkante</text>

  <!-- B1a: Rahmenaussenkante -> Dachkante, auf dem Dach -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="400" y1="270" x2="580" y2="270"/>
    <path d="M400,270 l8,-4 v8 z"/><path d="M580,270 l-8,-4 v8 z"/>
    <line x1="580" y1="278" x2="580" y2="262" stroke-width="1"/>
  </g>
  <text x="490" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#b30000">B1a</text>
  <text x="490" y="250" text-anchor="middle" font-size="9" fill="#555">Rahmenaußenkante → Innenseite Dachkante (Zollstock flach aufs Dach)</text>

  <!-- B1b: Ausschnittkante -> Rahmenaussenkante (von innen) -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="360" y1="410" x2="400" y2="410"/>
    <path d="M360,410 l8,-4 v8 z"/><path d="M400,410 l-8,-4 v8 z"/>
    <line x1="360" y1="402" x2="360" y2="418" stroke-width="1"/>
    <line x1="400" y1="402" x2="400" y2="418" stroke-width="1"/>
  </g>
  <text x="380" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#b30000">B1b</text>
  <text x="380" y="466" text-anchor="middle" font-size="9" fill="#555">Öffnungskante → Rahmenaußenkante</text>
  <text x="380" y="478" text-anchor="middle" font-size="9" fill="#555">(von INNEN durch die Öffnung messen)</text>

  <!-- Dachebene verlaengert (Referenz fuer B2) -->
  <line x1="60" y1="300" x2="700" y2="300" stroke="#0057b8" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="700" y="314" font-size="9" fill="#0057b8" text-anchor="end">Dachebene (Referenz)</text>

  <!-- B2: Hoehe Kante ueber Dachebene -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="656" y1="245" x2="656" y2="300"/>
    <path d="M656,245 l-4,8 h8 z"/><path d="M656,300 l-4,-8 h8 z"/>
    <line x1="620" y1="245" x2="664" y2="245" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <text x="676" y="276" font-size="13" font-weight="bold" fill="#b30000">B2</text>
  <text x="676" y="290" font-size="9" fill="#555">Kantenhöhe</text>

  <!-- B3: Dachstaerke am Ausschnitt -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="200" y1="300" x2="200" y2="340"/>
    <path d="M200,300 l-4,8 h8 z"/><path d="M200,340 l-4,-8 h8 z"/>
  </g>
  <text x="188" y="324" font-size="13" font-weight="bold" fill="#b30000" text-anchor="end">B3</text>
  <text x="186" y="338" font-size="9" fill="#555" text-anchor="end">Dachstärke (von innen am Öffnungsrand,</text>
  <text x="186" y="349" font-size="9" fill="#555" text-anchor="end">Decke → Dachhaut, ggf. am Heki-Innenrahmen)</text>

  <!-- ======================= ANSICHT 2: B4 AM GERAET ======================= -->
  <text x="60" y="560" font-size="15" font-weight="bold" fill="#222">Ansicht 2 — B4 am Belluna (auf dem Tisch, Haube GESCHLOSSEN)</text>
  <text x="60" y="580" font-size="11" fill="#666">Belluna komplett auf der Platte montiert. ACHTUNG: unterer Einbaukragen steht ~20 mm über —</text>
  <text x="60" y="594" font-size="11" fill="#666">Platte auf ZWEI LEISTEN legen (Kragen hängt frei) und B4 bis zur FLANSCH-UNTERSEITE messen.</text>

  <!-- Tisch + zwei Leisten (unterer Kragen haengt frei!) -->
  <line x1="80" y1="872" x2="660" y2="872" stroke="#333" stroke-width="3"/>
  <text x="90" y="886" font-size="10" fill="#666">ebener Tisch — Platte liegt auf ZWEI LEISTEN, der untere Einbaukragen hängt FREI dazwischen</text>

  <!-- Befestigungsplatte: Flansch + unterer Einbaukragen -->
  <rect x="160" y="816" width="360" height="16" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <g fill="#e9e9e9" stroke="#555" stroke-width="1.5">
    <rect x="252" y="832" width="12" height="22"/>
    <rect x="416" y="832" width="12" height="22"/>
  </g>
  <g fill="#d9d9d9" stroke="#333" stroke-width="1.5">
    <rect x="168" y="832" width="44" height="40"/>
    <rect x="468" y="832" width="44" height="40"/>
  </g>
  <text x="340" y="812" font-size="10" fill="#666" text-anchor="middle">Karosseriebefestigungsplatte (unterer Kragen zwischen den Leisten)</text>

  <!-- Lueftergehaeuse -->
  <rect x="220" y="716" width="240" height="100" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="340" y="772" font-size="11" fill="#999" text-anchor="middle">Belluna-Gehäuse</text>

  <!-- Haube geschlossen, Ueberstand nach hinten (rechts) -->
  <path d="M200,716 Q340,668 480,716 L560,738 Q568,742 560,748 L488,730 Q340,690 205,726 Z"
        fill="#e9e9e9" stroke="#555" stroke-width="1.8"/>
  <text x="340" y="700" font-size="11" fill="#666" text-anchor="middle">Haube (geschlossen)</text>
  <text x="565" y="764" font-size="10" fill="#555" text-anchor="middle">Hecküberstand</text>

  <!-- Kontaktebene = Flansch-UNTERSEITE (nicht der Tisch!) -->
  <line x1="160" y1="832" x2="700" y2="832" stroke="#0057b8" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="712" y="828" font-size="9" fill="#0057b8" text-anchor="end">Kontaktebene = Flansch-Unterseite</text>

  <!-- B4: Haubenunterkante ueber Flansch-Unterseite -->
  <g stroke="#b30000" stroke-width="1.5" fill="#b30000">
    <line x1="600" y1="748" x2="600" y2="832"/>
    <path d="M600,748 l-4,8 h8 z"/><path d="M600,832 l-4,-8 h8 z"/>
    <line x1="560" y1="748" x2="608" y2="748" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <text x="618" y="782" font-size="13" font-weight="bold" fill="#b30000">B4</text>
  <text x="618" y="795" font-size="9" fill="#555">Haubenunterkante über</text>
  <text x="618" y="806" font-size="9" fill="#555">FLANSCH-UNTERSEITE (nicht Tisch!)</text>

  <!-- ======================= FORMELKASTEN ======================= -->
  <rect x="60" y="890" width="600" height="70" rx="8" fill="#f7f7f7" stroke="#888" stroke-width="1"/>
  <text x="76" y="912" font-size="12" font-weight="bold" fill="#222">So rechnet die Pipeline damit (fem/analytic.py):</text>
  <text x="76" y="930" font-size="11" fill="#333">EDGE_DIST = B1a + B1b   ·   EDGE_H = B2   ·   ROOF_T = B3   ·   HOOD_UNDERSIDE_H = B4</text>
  <text x="76" y="948" font-size="11" fill="#333">Haubenfreigang über der Kante = 28 (H_RAISE) + B4 − B2   — nur kritisch, wenn Haube die Kante erreicht (179 ≥ EDGE_DIST)</text>
</svg>
