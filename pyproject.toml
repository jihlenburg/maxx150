# Werkzeugkonfiguration des Repos. Dies ist KEIN installierbares Paket --
# der Einstieg bleibt `python3 -m pipeline <stage>` (siehe README.md).
# Hier steht ausschliesslich explizit, was vorher implizit galt.

[tool.ruff]
# Referenz-Python der lokalen Werkzeugkette (macOS python3, FreeCAD-Bundle).
target-version = "py312"
line-length = 99

[tool.ruff.lint]
# Die bisher implizit genutzten Ruff-Defaults festgeschrieben:
# Pyflakes (F) + pycodestyle-Fehlerklassen (E4/E7/E9).
select = ["E4", "E7", "E9", "F"]
